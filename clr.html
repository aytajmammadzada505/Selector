<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>selector task</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
       /*task 1*/ 
        #Colorbox {
            width: 300px;
            height: 300px;
            border: 1px solid black;
        }

        #btn {
            width: 70px;
            height: 70px;
        }
        /*task 2*/
          .container {
            display: flex;
        }

        .card {
            border: 1px solid black;
            width: 150px;
            height: 150px;
        }

        /*task 3*/
         #circle {
            width: 180px;
            border-radius: 50%;
            height: 180px;
            background-color: aquamarine;
        }

        /* task 7*/
          .box {
            width: 200px;
            height: 200px;
            background-color: brown;
            transition: background-color 0.3s ease;
        }
        /*task 8*/
        .btn{
            width: 60px;
            height: 60px;
        }
    </style>
</head>

<body>
    <!-- Task 1 -->
    <div id="Colorbox"></div>
    <button id="btn">click</button>
    <script src="./clr.js"></script>

    <!-- task 2 -->
 <div class="container">
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
    </div>

    <!-- task 3 -->
    <div id="circle"></div>
    <script src="./clr.js"></script>

    
    <!-- task 4 -->
     <div class="container">
        <textarea id="txt" maxlength="100" placeholder="text here"></textarea>
        <div>Qalan simvol: <span id="counter">100</span></div>
    </div>
    <script src="./clr.js"></script>
<!-- task 5 -->
     <select id="colors">
        <option value="white">Ag</option>
        <option value="blue">Mavi</option>
        <option value="black">Qara</option>
    </select>

    <!-- task 6 -->
    <form id="former">
        <input type="text" id="put" placeholder="Name">
        <button type="submit">Daxil ol</button>
    </form>

    <!-- task 7 -->
    <div class="box"></div>
    
    <!-- task 8 -->
    <div id="products">
        <button class="btn" data-price=50>product 1</button>
        <button class="btn" data-price=150>product 2</button>
        <button class="btn" data-price=120>product 3</button>
    </div>
    <div id="total">
        <p> Umumi qiymet: <span id="price">0</span>AZN</p>
    </div>
</body>

</html>
